<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WorldAquariumProject</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:linear-gradient(180deg,#0c1f33,#040a12); color:#dce8f2;
         font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif; text-align:center;
         padding:48px 16px; }
  h1 { letter-spacing:.18em; font-weight:300; font-size:1.9rem; margin:0; }
  p.sub { color:#8fa6ba; letter-spacing:.14em; margin:14px 0 0; font-size:.95rem; }
  p.tagline { color:#dce8f2; letter-spacing:.1em; margin:6px 0 0; font-size:1.05rem; font-style:italic; }
  h2.members { margin:52px 0 0; font-size:.85rem; letter-spacing:.3em; color:#8fa6ba; font-weight:400; }

  .tank { margin-top:26px; display:flex; flex-wrap:wrap; gap:22px; justify-content:center; }
  .card { position:relative; width:270px; border:1px solid rgba(255,255,255,.15); border-radius:16px;
          background:rgba(255,255,255,.045); padding:28px 22px 18px; text-align:center;
          transition:transform .2s ease, border-color .2s ease, box-shadow .2s ease; }
  .card:hover { transform:translateY(-6px); border-color:#8fa6ba; box-shadow:0 14px 40px rgba(0,0,0,.45); }
  .card .ver { position:absolute; top:14px; left:16px; font-size:.72rem; color:#8fa6ba;
               letter-spacing:.15em; border:1px solid rgba(255,255,255,.2); border-radius:999px; padding:2px 10px; }
  .card a.face { display:block; text-decoration:none; color:#dce8f2; }
  .card img { width:110px; height:110px; border-radius:50%; object-fit:cover;
              border:3px solid rgba(255,255,255,.25); background:#0c1f33;
              transition:border-color .2s ease; }
  .card:hover img { border-color:#8fa6ba; }
  .card .name { display:block; font-weight:700; letter-spacing:.05em; font-size:1.08rem; margin-top:14px; }
  .card .species { display:block; font-style:italic; font-size:.8rem; color:#8fa6ba; margin-top:2px; }
  .card .catch { font-size:.84rem; color:#b9cbd9; margin:12px 0 0; line-height:1.7; min-height:3em; }
  .sns { display:flex; gap:8px; justify-content:center; margin-top:14px; flex-wrap:wrap; }
  .sns a, .sns span { font-size:.78rem; text-decoration:none; border:1px solid rgba(255,255,255,.2);
         border-radius:999px; padding:4px 12px; color:#dce8f2; }
  .sns a:hover { border-color:#f2938c; color:#f2938c; }
  .sns span.ph { color:#5f7484; border-style:dashed; cursor:default; }
</style>
</head>
<body>
  <div>
    <h1>WorldAquariumProject</h1>
    <p class="sub">Toward the Next Generation of Entertainment</p>
    <p class="tagline">We want to be living creatures.</p>
    <h2 class="members">MEMBERS</h2>
    <div class="tank">
      <div class="card">
        <span class="ver">1.0.0</span>
        <a class="face" href="/crayer/">
          <img src="/crayer/assets/icon.png" alt="クレイア＝アメリ">
          <span class="name">クレイア＝アメリ 🦞</span>
          <span class="species">Procambarus clarkii</span>
          <p class="catch">働きたくない。投資で生きたい。<br>仕事辞めたいザリガニV</p>
        </a>
        <div class="sns">
          <a href="https://x.com/creyfish_crayer" target="_blank" rel="noopener">𝕏 @creyfish_crayer</a>
          <span class="ph">▶ YouTube 準備中</span>
        </div>
      </div>
      <div class="card">
        <span class="ver">2.0.0</span>
        <a class="face" href="/pyon/">
          <img src="/pyon/assets/icon.png" alt="Pyon">
          <span class="name">Pyon＝Trichogaster 🐟</span>
          <span class="species">Trichogaster</span>
          <p class="catch">Minecraftの世界で、<br>毎日を生き延びている。</p>
        </a>
        <div class="sns">
          <span class="ph">𝕏 準備中</span>
          <a href="https://www.youtube.com/@amanusapyon" target="_blank" rel="noopener">▶ YouTube</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
